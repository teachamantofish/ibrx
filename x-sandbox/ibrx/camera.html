<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
<meta name="robots" content="index, follow">
  <link href="../css/bencustom.css" rel="stylesheet" type="text/css" >
  <link href="../css/table/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,200,0,-25" rel="stylesheet" />

  <script src="http://html2canvas.hertzen.com/dist/html2canvas.js"></script>


</head>
<body>





<script>
    document.addEventListener('DOMContentLoaded', function() { // Ensure DOM is fully loaded
        document.querySelectorAll('.cameraIcon').forEach(function(icon) {
            icon.addEventListener('click', function(event) {
                event.preventDefault(); // Prevent default action
                var targetId = this.getAttribute('data-target');
                html2canvas(document.getElementById(targetId)).then(function(canvas) {
                    canvas.toBlob(function(blob) {
                        var item = new ClipboardItem({ "image/png": blob });
                        navigator.clipboard.write([item]).then(function() {
                            console.log('Image copied to clipboard');
                        }).catch(function(error) {
                            console.error('Could not copy image to clipboard: ', error);
                        });
                    });
                });
            });
        });
    });
</script>

<section class="widgetcontainer" >
    <div class="mini-menu">
        <a class="cameraIcon" data-target="chart" href="#"><i class="material-symbols-outlined">photo_camera</i></a>
    </div>
    <div  id="chart">
        <div style="height:100%;width:100%; color:black; background-color: aliceblue;">
           <img src="img/timeline.png">
        </div>
    </div>
</section>

</body>
</html>
