<!-- Redirect legacy GitHub Pages visits; preserve paths, query strings, and anchors. -->
<script>
{
    const LEGACY_HOST = 'teachamantofish.github.io';
    const LEGACY_BASE = '/ibrx';
    const NEW_HOME = 'https://optionicity.com/ibrx/';
    const path = window.location.pathname;
    if (window.location.hostname === LEGACY_HOST &&
        (path === LEGACY_BASE || path.startsWith(LEGACY_BASE + '/'))) {
        window.location.replace(NEW_HOME + path.slice(LEGACY_BASE.length).replace(/^\//, '') +
            window.location.search + window.location.hash);
    }
}
</script>
