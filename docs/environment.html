<!DOCTYPE html>
<html lang="en">
<head>
    <title>IBRX Trading Environment</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ImmunityBio (IBRX) catalyst heat map: event intensity for each day from two weeks ago to 60 days out.">
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link href="css/sidenav.css" rel="stylesheet" type="text/css">
    <link href="css/bencustom.css" rel="stylesheet" type="text/css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="js/environment-config.js"></script>
    <style>
        /* Left-aligned, ~1em in from the menu. Whole pixels throughout (the site's 1em is 13.33px)
           so the matrix lands on the pixel grid and every 1px gap renders alike. */
        section {
            margin: 0;
            padding: 16px 16px 40px;
            /* Windows narrower than the cards: scroll both sideways together. */
            overflow-x: auto;
        }
        .page-subtitle {
            font-size: 0.85rem;
            line-height: 16px;
            color: #64748b;
            margin: 0 0 14px;
        }

        /* Card. Colours come from the active theme in js/environment-config.js. */
        /* The cell grid is sized in whole *screen* pixels (the -dev values) so every gap is exactly
           one screen pixel at any display scaling. snapGrid() in the script sets --dpr and the -dev
           values for the screen; these defaults are 100%. --cols is set from DAYS in the script. */
        .env-card {
            --lab: 285px;
            --dpr: 1;
            --cell-dev: 11;
            --row-dev: 16;
            --row-total-dev: 20;
            --pitch-dev: calc(var(--cell-dev) + 1);
            --cell: calc(var(--cell-dev) * 1px / var(--dpr));
            --gap-w: calc(1px / var(--dpr));
            --pitch: calc(var(--pitch-dev) * 1px / var(--dpr));
            --row: calc((var(--row-dev) - 1) * 1px / var(--dpr));
            --row-total: calc(var(--row-total-dev) * 1px / var(--dpr));
            position: relative;
            width: max-content;
            box-sizing: border-box;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px 12px 12px;
            box-shadow: var(--card-shadow);
            color: var(--fg);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        .env-toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .env-toolbar h2 {
            margin: 0 auto 0 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
        }
        .env-btn {
            height: 26px;
            padding: 0 12px;
            border: 1px solid var(--btn-border);
            border-radius: 999px;
            background: var(--btn-bg);
            color: var(--fg);
            font: 500 12px system-ui, sans-serif;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
        }
        .env-btn:hover {
            background: rgba(var(--accent-rgb), 0.12);
            border-color: var(--accent);
            color: var(--fg-strong);
        }
        .env-btn.active {
            background: rgba(var(--accent-rgb), 0.2);
            border-color: var(--accent);
            color: var(--fg-strong);
        }
        .env-btn:focus-visible,
        .theme-swatch:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.45);
        }

        /* Theme picker: one gradient swatch per theme. */
        .theme-pick {
            display: flex;
            gap: 6px;
        }
        .theme-swatch {
            width: 34px;
            height: 18px;
            padding: 0;
            border: 1px solid var(--btn-border);
            border-radius: 999px;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
        }
        .theme-swatch:hover {
            transform: scale(1.08);
        }
        .theme-swatch[aria-checked="true"] {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.35);
        }

        .hm-head,
        .hm-row {
            display: grid;
            grid-template-columns: var(--lab) calc(var(--cols) * var(--pitch) - var(--gap-w));
        }
        .hm-head {
            height: 28px;
            margin-bottom: 4px;
        }
        /* Fridays: weekly options expiry. Third Fridays: monthly expiry. */
        .hm-ticks {
            position: relative;
            font-size: 9px;
            color: var(--muted);
        }
        .hm-ticks span {
            position: absolute;
            bottom: 0;
            transform: translateX(-50%);
            white-space: nowrap;
            line-height: 12px;
            text-align: center;
        }
        .hm-ticks span::after {
            content: '';
            display: block;
            width: 1px;
            height: 4px;
            margin: 1px auto 0;
            background: var(--tick-line);
        }
        .hm-ticks span.opex {
            color: var(--accent);
            font-weight: 600;
        }
        .hm-ticks span.opex::before {
            content: 'OPEX';
            display: block;
            font-size: 7.5px;
            letter-spacing: 0.12em;
        }
        .hm-ticks span.opex::after {
            background: var(--accent);
        }
        .hm-body {
            position: relative;
        }
        .opex-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: rgba(var(--accent-rgb), 0.55);
            box-shadow: 0 0 6px rgba(var(--accent-rgb), 0.6);
            pointer-events: none;
            z-index: 1;
        }
        .hm-row {
            height: var(--row);
            margin-bottom: var(--gap-w);
        }
        .hm-row.total {
            height: var(--row-total);
            margin-bottom: 7px;
        }
        .hm-row.total .lab {
            color: var(--accent);
            font-weight: 600;
        }
        .lab {
            padding: 1px 10px 1px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10.5px;
            line-height: 13px;
            color: var(--fg);
            transition: color 0.15s;
        }
        .hm-row.hl .lab {
            color: var(--fg-strong);
        }
        /* Each cell is placed from its own column number rather than after the previous cell, so
           rounding can't build up across the row and nudge some gaps a screen pixel wider. */
        .cells {
            position: relative;
            background: var(--gap);
        }

        .c {
            position: absolute;
            top: 0;
            bottom: 0;
            /* One calc, so it is rounded once rather than as col x (an already-rounded pitch). */
            left: calc(var(--col) * var(--pitch-dev) * 1px / var(--dpr));
            width: var(--cell);
            box-shadow: 0 0 calc(var(--v) * 5px) rgba(var(--glow-rgb), calc(var(--v) * 0.5));
            transition: transform 0.15s ease-out, opacity 0.15s, filter 0.15s, background-color 0.3s;
        }
        /* Load-in: cells fade up in a diagonal wave. */
        .play .c {
            animation: appear 0.5s ease-out backwards;
            animation-delay: calc((var(--r) * 2 + var(--col)) * 8ms);
        }
        .c.hot {
            animation: glow 2.6s ease-in-out infinite;
            animation-delay: calc(var(--col) * -60ms);
        }
        .play .c.hot {
            animation: appear 0.5s ease-out backwards, glow 2.6s ease-in-out 1.4s infinite;
            animation-delay: calc((var(--r) * 2 + var(--col)) * 8ms), calc(1.4s + var(--col) * -60ms);
        }
        @keyframes appear {
            from {
                opacity: 0;
                transform: scaleY(0.2);
            }
        }
        /* Box-shadow only (a white inset stands in for brightening): animating filter moves the
           cells onto their own GPU layers, which blurs the 1px gaps at 125% / 150% scaling. */
        @keyframes glow {
            50% {
                box-shadow: 0 0 8px rgba(var(--hot-glow-rgb), 0.6),
                    inset 0 0 0 20px rgba(255, 255, 255, calc((var(--hot-brightness) - 1) * 0.6));
            }
        }

        /* Hover crosshair: dim everything but the hovered row and column. */
        .hm.hovering .c { opacity: 0.4; }
        .hm.hovering .c.hl { opacity: 1; }
        /* Hovering a catalyst's name: ring its whole row of cells. */
        .hm-row.row-focus .cells {
            outline: 1px solid var(--focus-ring);
            outline-offset: 1px;
        }
        .hm .c.focus {
            z-index: 2;
            transform: scale(1.8);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--focus-ring);
        }

        /* Market intensity card: line graphs on the matrix's day axis, so a day sits in the same
           column in both cards. renderIntensity() sizes the plot to match the matrix card's height. */
        .intensity-card {
            margin-top: 16px;
        }
        .ix-body {
            display: grid;
            grid-template-columns: var(--lab) calc(var(--cols) * var(--pitch) - var(--gap-w));
        }
        .ix-plot {
            position: relative;
            height: 240px;
            border-left: 1px solid var(--tick-line);
            border-bottom: 1px solid var(--tick-line);
            box-sizing: border-box;
        }
        .ix-plot .grid-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px dashed rgba(147, 166, 198, 0.18);
        }
        .ix-plot .opex-line {
            box-shadow: none;
        }
        .ix-plot svg {
            position: absolute;
            top: 0;
            left: -1px;
            overflow: visible;
        }
        /* Y-axis values: price just left of the plot, contracts left of that, shares just inside
           the plot's right edge. */
        .ix-axis {
            position: absolute;
            transform: translateY(-50%);
            font-size: 9px;
            line-height: 1;
            color: var(--muted);
            white-space: nowrap;
            pointer-events: none;
        }
        .ix-axis.price { right: calc(100% + 6px); }
        .ix-axis.shares { right: 4px; }
        .ix-axis.contracts { right: calc(100% + 48px); }
        /* Readout in the left column: the hovered day (or the latest) and each line's value. */
        .ix-legend {
            padding-right: 96px;
            font-size: 10.5px;
            line-height: 13px;
            color: var(--fg);
        }
        .ix-legend .day {
            margin-bottom: 8px;
            color: var(--muted);
        }
        .ix-legend .series {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .ix-legend .swatch {
            flex: none;
            width: 14px;
            height: 0;
            border-top: 2px solid;
        }
        .ix-legend .val {
            margin-left: auto;
            color: var(--fg-strong);
            font-variant-numeric: tabular-nums;
        }
        .ix-legend .note {
            margin-top: 10px;
            font-size: 9.5px;
            line-height: 12px;
            color: var(--muted);
        }
        .ix-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        /* Legend */
        .env-legend {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 14px;
            padding-left: var(--lab);
            font-size: 10px;
            color: var(--muted);
        }
        .env-legend .bar {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            border: 1px solid var(--card-border);
        }

        /* Tooltip */
        .env-tip {
            position: absolute;
            z-index: 5;
            max-width: 240px;
            padding: 8px 10px;
            border: 1px solid rgba(var(--accent-rgb), 0.35);
            border-radius: 8px;
            background: var(--tip-bg);
            backdrop-filter: blur(4px);
            color: var(--tip-fg);
            font-size: 11px;
            line-height: 1.4;
            pointer-events: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }
        .env-tip b {
            display: block;
            color: var(--fg-strong);
            font-weight: 600;
        }
        .env-tip .v {
            color: var(--accent);
            font-weight: 600;
        }
        .env-tip .k {
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .env-card { --lab: 120px; }
            .lab { font-size: 9.5px; line-height: 12px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .play .c, .c.hot, .play .c.hot { animation: none; }
        }
    </style>
</head>

<body class="ibrx-csv-timeline">

<header class="hero">
    <canvas aria-hidden="true"></canvas>
    <div class="hero-text">
        <div class="hero-kicker">ImmunityBio · IBRX</div>
        <h1 class="hero-title">Trading Environment</h1>
        <div class="hero-subtitle">Catalyst intensity · past 2 weeks · next 60 days</div>
    </div>
</header>
<script src="js/sidenav.js"></script>
<script src="js/header-helix.js"></script>

<section>
    <p class="page-subtitle" id="loadingMsg">Loading events…</p>
    <div class="env-card" id="envCard">
        <div class="env-toolbar">
            <h2>Event catalyst matrix</h2>
            <div class="theme-pick" id="themePick" role="radiogroup" aria-label="Colour theme"></div>
            <button type="button" class="env-btn" id="opexBtn"
                    title="Move each event's peak onto the monthly OPEX it overlaps">Opex center</button>
        </div>
        <div class="hm play" id="hm"></div>
        <div class="env-legend"><span>Quiet</span><div class="bar"></div><span>Hot</span></div>
        <div class="env-tip" id="envTip" hidden></div>
    </div>
    <div class="env-card intensity-card" id="intensityCard">
        <div class="env-toolbar">
            <h2>Market intensity catalysts</h2>
        </div>
        <div id="intensity"></div>
    </div>
</section>

<script>
const CONFIG = window.ENV_CONFIG;
const PAST_DAYS = 14; // two weeks before today
const DAYS = PAST_DAYS + 61; // ... then today plus 60 days out
const DAY_MS = 86400000;
const MONTHS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
const THEME_KEY = 'ibrxEnvTheme';
let ramp = [];

function hexToRgb(hex) {
    return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
}

// Colour for heat t (0..1) on the active theme's ramp.
function rampColor(t) {
    const x = Math.max(0, Math.min(1, t)) * (ramp.length - 1);
    const i = Math.min(Math.floor(x), ramp.length - 2);
    const f = x - i;
    const rgb = ramp[i].map((a, k) => Math.round(a + (ramp[i + 1][k] - a) * f));
    return `rgb(${rgb.join(',')})`;
}

// Quiet cells sit a little above the bottom of the ramp so the grid stays visible.
function cellColor(v) {
    return rampColor(0.06 + v * 0.94);
}

function savedThemeName() {
    try {
        const name = localStorage.getItem(THEME_KEY);
        if (name && CONFIG.themes[name]) return name;
    } catch (e) { /* storage blocked: fall back to the default */ }
    return CONFIG.defaultTheme;
}

function applyTheme(name) {
    const theme = CONFIG.themes[name];
    ramp = theme.ramp.map(hexToRgb);
    document.querySelectorAll('.env-card').forEach(card => {
        Object.entries(theme.vars).forEach(([key, value]) => card.style.setProperty(key, value));
    });
    document.querySelector('.env-legend .bar').style.background = `linear-gradient(90deg, ${theme.ramp.join(', ')})`;
    document.querySelectorAll('#hm .c').forEach(cell => {
        cell.style.background = cellColor(+cell.style.getPropertyValue('--v'));
    });
    document.querySelectorAll('.theme-swatch').forEach(btn => {
        btn.setAttribute('aria-checked', String(btn.dataset.theme === name));
    });
    try { localStorage.setItem(THEME_KEY, name); } catch (e) { /* not remembered; fine */ }
}

function buildThemePicker() {
    const pick = document.getElementById('themePick');
    pick.innerHTML = Object.entries(CONFIG.themes).map(([name, theme]) =>
        `<button type="button" class="theme-swatch" role="radio" data-theme="${name}" ` +
        `title="${theme.label} theme" aria-label="${theme.label}" ` +
        `style="background:linear-gradient(90deg, ${theme.ramp.join(', ')})"></button>`
    ).join('');
    pick.addEventListener('click', e => {
        const btn = e.target.closest('.theme-swatch');
        if (btn) applyTheme(btn.dataset.theme);
    });
}

// "Nov 4-8 2026", "Dec 3 2026", "March 22-24 2026", "Nov 2026", "2026-12-01" or "2026-11"
// -> {start, end, monthOnly}
function parseEventDate(text) {
    const s = text.trim();
    let m = s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
    if (m) {
        if (!m[3]) return { start: new Date(+m[1], +m[2] - 1, 1), end: new Date(+m[1], +m[2], 0), monthOnly: true };
        const d = new Date(+m[1], +m[2] - 1, +m[3]);
        return { start: d, end: d, monthOnly: false };
    }
    m = s.match(/^([A-Za-z]+)\s+(\d{1,2})(?:\s*-\s*(\d{1,2}))?\s+(\d{4})$/);
    if (m) {
        const mon = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
        if (mon < 0) return null;
        return {
            start: new Date(+m[4], mon, +m[2]),
            end: new Date(+m[4], mon, +(m[3] || m[2])),
            monthOnly: false
        };
    }
    m = s.match(/^([A-Za-z]+)\s+(\d{4})$/);
    if (m) {
        const mon = MONTHS.indexOf(m[1].slice(0, 3).toLowerCase());
        if (mon < 0) return null;
        return { start: new Date(+m[2], mon, 1), end: new Date(+m[2], mon + 1, 0), monthOnly: true };
    }
    return null;
}

// The first keyword category whose match patterns all hit; the catch-all last entry has none.
// Categories with a source (trial completions) are fed from their own file, never matched.
function categorize(text) {
    return CONFIG.categories.find(cat => !cat.source && (cat.match || []).every(re =>
        (re.source === 'CONFERENCE' ? CONFIG.conferencePattern : re).test(text)));
}

// events.csv rows -> {dateText, name, details, text, category}
function eventsFromCsv(rows) {
    return rows.map(r => {
        const name = (r['Event'] || '').trim();
        const details = (r['Details'] || '').trim();
        return { dateText: (r['Date'] || '').trim(), name, details, text: name + ' ' + details, category: categorize(name + ' ' + details) };
    });
}

// ibrx.csv rows -> one row per trial, dated by its primary completion.
function trialsFromCsv(rows) {
    const category = CONFIG.categories.find(cat => cat.source === 'trials');
    if (!category) return [];
    return rows.filter(r => (r['Indication'] || '').trim()).map(r => {
        const indication = r['Indication'].split(';')[0].trim();
        const nct = (r['Link'] || '').split('/').pop();
        return {
            dateText: (r['Primary completion'] || '').trim(),
            name: `${indication} trial (${(r['Phase'] || '').trim()})`,
            details: [nct, r['IBRX drug'], r['Sponsor']].map(x => (x || '').trim()).filter(Boolean).join(' · '),
            text: '',
            category
        };
    });
}

// Whole days from a to b, immune to daylight-saving hours.
function dayDiff(a, b) {
    return Math.round((b - a) / DAY_MS);
}

// Heat 0..1 (before weighting) for one event on one day: full from peakStart to peakEnd,
// then a straight fade over the category's fadeLeft / fadeRight days.
function shape(day, ev) {
    const fade = (days, length) => Math.max(0, 1 - days / (length + 1));
    if (day < ev.peakStart) return fade(dayDiff(day, ev.peakStart), ev.category.fadeLeft);
    if (day > ev.peakEnd) return fade(dayDiff(ev.peakEnd, day), ev.category.fadeRight);
    return 1;
}

function fmtDate(d) {
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function isMonthlyOpex(d) {
    return d.getDay() === 5 && d.getDate() >= 15 && d.getDate() <= 21;
}

function addDays(d, n) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

// Opex center: the same shaded days (first to last), but peaking on the monthly OPEX inside them
// (the one nearest the event's own date) and fading in a straight line out to each end.
// Events whose shading holds no monthly OPEX keep their own shape.
function opexValues(ev, days) {
    const opex = days.filter(d => isMonthlyOpex(d) && d >= ev.first && d <= ev.last)
        .sort((a, b) => Math.abs(a - ev.center) - Math.abs(b - ev.center))[0];
    if (!opex) return ev.baseValues;
    const left = dayDiff(ev.first, opex);
    const right = dayDiff(opex, ev.last);
    return days.map(d => {
        if (d < ev.first || d > ev.last) return 0;
        const heat = d <= opex
            ? 1 - dayDiff(d, opex) / (left + 1)
            : 1 - dayDiff(opex, d) / (right + 1);
        return ev.weight * heat;
    });
}

// Combined heat per day, scaled so the window's hottest day is 1.
function totalsOf(events) {
    const totals = events[0] ? events[0].values.map((_, i) => events.reduce((sum, ev) => sum + ev.values[i], 0)) : [];
    const maxTotal = Math.max.apply(null, totals) || 1;
    return totals.map(t => t / maxTotal);
}

function buildMatrix(sourceRows) {
    const today = new Date();
    const days = Array.from({ length: DAYS }, (_, i) =>
        new Date(today.getFullYear(), today.getMonth(), today.getDate() - PAST_DAYS + i));

    const events = sourceRows.map(r => {
        const date = parseEventDate(r.dateText);
        if (!date || !r.name) return null;
        const ev = {
            // The tooltip shows the estimated flag, so drop "(Estimated)" / "(expected)" from the title.
            name: r.name.replace(/\s*\((estimated|expected)\)/i, ''),
            details: r.details,
            dateText: r.dateText,
            start: date.start,
            end: date.end,
            center: date.monthOnly
                ? new Date(date.start.getFullYear(), date.start.getMonth(), 15)
                : date.start,
            estimated: date.monthOnly || CONFIG.estimatedPattern.test(r.text),
            category: r.category
        };
        ev.peakStart = date.monthOnly ? ev.center : ev.start;
        ev.peakEnd = date.monthOnly ? ev.center : ev.end;
        ev.weight = ev.category.weight;
        // First and last shaded days: the peak plus its fade either side.
        ev.first = addDays(ev.peakStart, -ev.category.fadeLeft);
        ev.last = addDays(ev.peakEnd, ev.category.fadeRight);
        ev.baseValues = days.map(d => ev.weight * shape(d, ev));
        ev.values = ev.baseValues;
        return ev;
    }).filter(ev => ev && Math.max.apply(null, ev.values) >= CONFIG.minRowHeat)
      .sort((a, b) => a.center - b.center);

    return { days, events, totals: totalsOf(events) };
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Whole-pixel positions on the cell grid: a day column's left edge, and its centre.
const colStart = i => `${i} * var(--pitch-dev) * 1px / var(--dpr)`;
const tickLeft = i => `calc(${colStart(i)} + var(--cell) / 2)`;

// Friday date marks above the day columns, shared by both cards.
function ticksHtml(days) {
    return `<div class="hm-head"><div></div><div class="hm-ticks">` + days.map((d, i) => d.getDay() !== 5 ? '' :
        `<span class="${isMonthlyOpex(d) ? 'opex' : ''}" style="left:${tickLeft(i)}">${fmtDate(d)}</span>`
    ).join('') + `</div></div>`;
}

// 3px monthly OPEX lines over the middle of their day; offset is whatever sits left of the columns.
function opexLinesHtml(days, offset) {
    return days.map((d, i) => isMonthlyOpex(d)
        ? `<div class="opex-line" style="left:calc(${offset} + ${colStart(i)} + (var(--cell) - 3px) / 2)"></div>` : ''
    ).join('');
}

function render(model) {
    const hm = document.getElementById('hm');
    document.querySelectorAll('.env-card').forEach(card => card.style.setProperty('--cols', DAYS));

    const cellsHtml = (values, r) => values.map((v, c) =>
        `<div class="c${v >= CONFIG.hotHeat ? ' hot' : ''}" data-r="${r}" data-c="${c}" ` +
        `style="--v:${v.toFixed(3)};--r:${r};--col:${c};background:${cellColor(v)}"></div>`
    ).join('');

    const rowsHtml = model.events.map((ev, r) =>
        `<div class="hm-row" data-r="${r + 1}">` +
        `<div class="lab" title="${escapeHtml(ev.name)}">${escapeHtml(ev.name)}</div>` +
        `<div class="cells">${cellsHtml(ev.values, r + 1)}</div></div>`
    ).join('');

    hm.innerHTML =
        ticksHtml(model.days) +
        `<div class="hm-body">` +
        `<div class="hm-row total" data-r="0"><div class="lab">All catalysts</div>` +
        `<div class="cells">${cellsHtml(model.totals, 0)}</div></div>` +
        rowsHtml + opexLinesHtml(model.days, 'var(--lab)') + `</div>`;
}

// ─── Market intensity ─────────────────────────────────────────────────────────
// Line graphs on the matrix's day axis, from data/ibrx_daily.csv. Each axis in the config
// ('price', 'shares') gets its own y scale; lines on the same axis share it.
let intensity = null;

function fmtValue(v, format) {
    if (format === 'price') return `$${v.toFixed(2)}`;
    if (format === 'contracts') return Math.round(v).toLocaleString('en-US');
    if (v >= 1e6) return `${(v / 1e6).toFixed(v >= 1e7 ? 1 : 2)}M`;
    if (v >= 1e3) return `${Math.round(v / 1e3)}K`;
    return String(Math.round(v));
}

// A round step (1, 2, 2.5 or 5 x 10^n) so that 4 steps cover span. fine adds 1.5, 3, 4, 6 and 8,
// so a zero-based axis doesn't waste half its height (21.5M peak: 24M top, not 40M).
function niceStep(span, fine) {
    const raw = span / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const steps = fine ? [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10] : [1, 2, 2.5, 5, 10];
    return steps.map(m => m * mag).find(s => s >= raw);
}

// y range for an axis, split in quarters to match the gridlines. Shares start at zero.
function axisRange(values, fromZero) {
    const max = Math.max.apply(null, values);
    const min = fromZero ? 0 : Math.min.apply(null, values);
    const step = niceStep((max - min) || max || 1, fromZero);
    const lo = fromZero ? 0 : Math.floor(min / step) * step;
    let hi = lo + step * 4;
    if (hi < max) hi = lo + niceStep(max - lo, fromZero) * 4;
    return { lo, hi };
}

// daily CSV rows -> one point list per configured series, on the matrix's day columns.
function intensityModel(model, rows) {
    // Rows from all the intensity files, merged into one row per day.
    const byDay = new Map();
    rows.forEach(r => {
        const date = parseEventDate((r['date'] || '').trim());
        if (!date) return;
        const c = dayDiff(model.days[0], date.start);
        if (c >= 0 && c < DAYS) byDay.set(c, Object.assign(byDay.get(c) || {}, r));
    });
    const cols = Array.from(byDay.keys()).sort((a, b) => a - b);
    const series = CONFIG.intensitySeries.map(def => ({
        def,
        points: cols.map(c => ({ c, v: parseFloat(byDay.get(c)[def.column]) })).filter(p => !Number.isNaN(p.v))
    }));
    const axes = {};
    series.forEach(sr => {
        (axes[sr.def.axis] = axes[sr.def.axis] || { values: [], format: sr.def.format })
            .values.push(...sr.points.map(p => p.v));
    });
    Object.entries(axes).forEach(([name, axis]) => {
        if (axis.values.length) Object.assign(axis, axisRange(axis.values, name !== 'price'));
    });
    return { days: model.days, cols, series, axes };
}

function renderIntensity(model, dailyRows) {
    intensity = intensityModel(model, dailyRows);
    const grid = [0.25, 0.5, 0.75].map(f => `<div class="grid-line" style="top:${f * 100}%"></div>`).join('');
    const hasData = intensity.series.some(sr => sr.points.length);
    document.getElementById('intensity').innerHTML =
        ticksHtml(model.days) +
        `<div class="ix-body"><div class="ix-legend" id="ixLegend"></div>` +
        `<div class="ix-plot" id="ixPlot">` + grid + opexLinesHtml(model.days, '-1px') +
        (hasData ? '' : `<div class="ix-empty">No market data in this window</div>`) +
        `<svg id="ixSvg" aria-hidden="true"></svg></div></div>`;
    showIntensityDay(null);
    matchIntensityHeight();

    const plot = document.getElementById('ixPlot');
    plot.addEventListener('mousemove', e => {
        const box = plot.getBoundingClientRect();
        const pitch = box.width / DAYS;
        const c = Math.max(0, Math.min(DAYS - 1, Math.floor((e.clientX - box.left) / pitch)));
        // Snap to the nearest trading day with data.
        const nearest = intensity.cols.reduce((best, col) => Math.abs(col - c) < Math.abs(best - c) ? col : best, intensity.cols[0]);
        showIntensityDay(nearest);
    });
    plot.addEventListener('mouseleave', () => showIntensityDay(null));
}

// Draws the lines and the axis values at the plot's current size.
function drawIntensity() {
    const svg = document.getElementById('ixSvg');
    const plot = document.getElementById('ixPlot');
    if (!svg || !intensity) return;
    const dpr = window.devicePixelRatio || 1;
    const cellDev = Math.round(CONFIG.cellWidth * dpr);
    const pitch = (cellDev + 1) / dpr;
    const half = cellDev / dpr / 2; // column centre (the svg starts at the plot's outer edge, like the cells)
    const w = plot.offsetWidth;
    const h = plot.clientHeight;
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    intensity.colX = c => c * pitch + half;
    const xy = (c, v, axis) => {
        const range = intensity.axes[axis];
        return [intensity.colX(c), h - (v - range.lo) / (range.hi - range.lo) * h];
    };
    intensity.xy = xy;

    // Day gridlines in the gaps between the matrix's columns: one screen pixel, on the pixel grid.
    const dayLines = Array.from({ length: DAYS - 1 }, (_, c) => {
        const x = ((c + 1) * (cellDev + 1) - 0.5) / dpr;
        return `<line x1="${x}" x2="${x}" y1="0" y2="${h}"/>`;
    }).join('');

    // Each line's latest value at its end, in its colour; labels closer than 12px are pushed apart.
    const ends = intensity.series.filter(sr => sr.points.length).map(sr => {
        const last = sr.points[sr.points.length - 1];
        const [x, y] = xy(last.c, last.v, sr.def.axis);
        return { x, y, labelY: y, sr, text: fmtValue(last.v, sr.def.format) };
    }).sort((a, b) => a.y - b.y);
    ends.forEach((end, i) => {
        if (i) end.labelY = Math.max(end.labelY, ends[i - 1].labelY + 12);
    });

    svg.innerHTML =
        `<g stroke="rgba(147, 166, 198, 0.12)" stroke-width="${1 / dpr}">${dayLines}</g>` +
        intensity.series.map(sr => {
            if (!sr.points.length) return '';
            const d = sr.points.map((p, i) => (i ? 'L' : 'M') + xy(p.c, p.v, sr.def.axis).map(n => n.toFixed(1)).join(','));
            return `<path d="${d.join('')}" fill="none" stroke="${sr.def.color}" stroke-width="${sr.def.width}" ` +
                `stroke-linejoin="round" stroke-linecap="round"/>`;
        }).join('') +
        ends.map(end =>
            `<circle cx="${end.x}" cy="${end.y}" r="2.5" fill="${end.sr.def.color}"/>` +
            `<text x="${end.x + 7}" y="${end.labelY + 3.5}" fill="${end.sr.def.color}" font-size="10.5" ` +
            `font-weight="600">${end.text}</text>`
        ).join('') +
        `<g id="ixHover"></g>`;

    plot.querySelectorAll('.ix-axis').forEach(el => el.remove());
    Object.entries(intensity.axes).forEach(([name, axis]) => {
        if (axis.hi === undefined || !['price', 'shares', 'contracts'].includes(name)) return;
        [0, 0.25, 0.5, 0.75, 1].forEach(f => {
            const label = document.createElement('div');
            label.className = `ix-axis ${name}`;
            label.style.top = `${(1 - f) * 100}%`;
            label.textContent = fmtValue(axis.lo + (axis.hi - axis.lo) * f, axis.format);
            plot.appendChild(label);
        });
    });
    showIntensityDay(intensity.hoverCol);
}

// Readout for day column c (the latest day when c is null), with a guide line and dots on the plot.
function showIntensityDay(c) {
    intensity.hoverCol = c;
    const col = c === null ? intensity.cols[intensity.cols.length - 1] : c;
    const legend = document.getElementById('ixLegend');
    if (col === undefined) {
        legend.innerHTML = '';
        return;
    }
    const valueAt = sr => (sr.points.find(p => p.c === col) || {}).v;
    const columnAt = column => {
        const sr = intensity.series.find(x => x.def.column === column);
        return sr && valueAt(sr);
    };
    const vol = columnAt('volume');
    const shortVal = columnAt('short_volume');
    legend.innerHTML =
        `<div class="day">${c === null ? 'Latest · ' : ''}${fmtDate(intensity.days[col])}</div>` +
        intensity.series.map(sr => {
            const v = valueAt(sr);
            return `<div class="series"><span class="swatch" style="border-color:${sr.def.color}"></span>` +
                `${sr.def.label}<span class="val">${v === undefined ? '–' : fmtValue(v, sr.def.format)}</span></div>`;
        }).join('') +
        (vol && shortVal ? `<div class="note">Short volume is ${Math.round(shortVal / vol * 100)}% of volume ` +
            `(FINRA-reported short sales only).</div>` : '');

    const hover = document.getElementById('ixHover');
    if (!hover || !intensity.xy) return;
    if (c === null) {
        hover.innerHTML = '';
        return;
    }
    const h = document.getElementById('ixPlot').clientHeight;
    const x = intensity.colX(col);
    hover.innerHTML = `<line x1="${x}" x2="${x}" y1="0" y2="${h}" stroke="rgba(255,255,255,0.35)"/>` +
        intensity.series.map(sr => {
            const v = valueAt(sr);
            if (v === undefined) return '';
            const [px, py] = intensity.xy(col, v, sr.def.axis);
            return `<circle cx="${px}" cy="${py}" r="3" fill="${sr.def.color}"/>`;
        }).join('');
}

// Same size as the matrix card: grow or shrink the plot by the difference in card heights.
function matchIntensityHeight() {
    const plot = document.getElementById('ixPlot');
    if (!plot) return;
    const diff = document.getElementById('envCard').offsetHeight - document.getElementById('intensityCard').offsetHeight;
    plot.style.height = Math.max(120, plot.offsetHeight + diff) + 'px';
    drawIntensity();
}

function wireInteractions(model) {
    const card = document.getElementById('envCard');
    const hm = document.getElementById('hm');
    const tip = document.getElementById('envTip');
    let lit = [];

    function clearHighlight() {
        lit.forEach(el => el.classList.remove('hl', 'focus', 'row-focus'));
        lit = [];
        hm.classList.remove('hovering');
        tip.hidden = true;
    }

    // A catalyst's name: light its whole row and show what the event is.
    function highlightRow(row) {
        clearHighlight();
        const r = row.dataset.r;
        lit = Array.from(row.querySelectorAll('.c'));
        lit.push(row);
        lit.forEach(el => el.classList.add('hl'));
        row.classList.add('row-focus');
        hm.classList.add('hovering');

        const values = r === '0' ? model.totals : model.events[+r - 1].values;
        const peak = values.indexOf(Math.max.apply(null, values));
        const peakText = `Peak heat <span class="v">${Math.round(values[peak] * 100)}%</span> on ${fmtDate(model.days[peak])}`;
        if (r === '0') {
            tip.innerHTML = `<b>All catalysts</b>Every event's heat added together<br>${peakText}`;
        } else {
            const ev = model.events[+r - 1];
            tip.innerHTML = `<b>${escapeHtml(ev.name)}</b>` +
                `<span class="k">${ev.category.label} · ${escapeHtml(ev.dateText)}` +
                `${ev.estimated ? ' (estimated)' : ''}</span><br>` +
                (ev.category.source ? `<span class="k">${escapeHtml(ev.details)}</span><br>` : '') +
                peakText;
        }
        tip.hidden = false;
    }

    hm.addEventListener('mouseover', e => {
        const label = e.target.closest('.lab');
        if (label) {
            highlightRow(label.parentNode);
            return;
        }
        const cell = e.target.closest('.c');
        if (!cell) return;
        clearHighlight();
        const r = cell.dataset.r;
        const c = +cell.dataset.c;
        lit = Array.from(hm.querySelectorAll(`.c[data-r="${r}"], .c[data-c="${c}"]`));
        lit.push(hm.querySelector(`.hm-row[data-r="${r}"]`));
        lit.forEach(el => el.classList.add('hl'));
        cell.classList.add('focus');
        hm.classList.add('hovering');

        const day = model.days[c];
        const out = c - PAST_DAYS;
        const ago = Math.abs(out);
        const when = `${fmtDate(day)} · ${out === 0 ? 'today' : `${ago} day${ago === 1 ? '' : 's'} ${out < 0 ? 'ago' : 'out'}`}` +
            (isMonthlyOpex(day) ? ' · monthly OPEX' : day.getDay() === 5 ? ' · weekly OPEX' : '');
        if (r === '0') {
            tip.innerHTML = `<b>All catalysts</b>${when}<br>` +
                `Combined heat <span class="v">${Math.round(model.totals[c] * 100)}%</span> of the window's peak`;
        } else {
            const ev = model.events[+r - 1];
            tip.innerHTML = `<b>${escapeHtml(ev.name)}</b>` +
                `<span class="k">${ev.category.label} · ${escapeHtml(ev.dateText)}` +
                `${ev.estimated ? ' (estimated)' : ''}</span><br>` +
                (ev.category.source ? `<span class="k">${escapeHtml(ev.details)}</span><br>` : '') +
                `${when} · heat <span class="v">${Math.round(ev.values[c] * 100)}%</span>`;
        }
        tip.hidden = false;
    });

    hm.addEventListener('mousemove', e => {
        if (tip.hidden) return;
        const box = card.getBoundingClientRect();
        const x = e.clientX - box.left;
        const y = e.clientY - box.top;
        tip.style.left = Math.max(8, Math.min(x + 14, box.width - tip.offsetWidth - 8)) + 'px';
        tip.style.top = (y + 18 + tip.offsetHeight > box.height ? y - tip.offsetHeight - 12 : y + 18) + 'px';
    });

    hm.addEventListener('mouseleave', clearHighlight);

    // Opex center: the cells stay put; their shades move so each event peaks on its monthly OPEX.
    // The button then reads "Date center", which puts the peaks back on the event dates.
    const opexBtn = document.getElementById('opexBtn');
    opexBtn.addEventListener('click', () => {
        const on = !opexBtn.classList.contains('active');
        opexBtn.classList.toggle('active', on);
        opexBtn.textContent = on ? 'Date center' : 'Opex center';
        opexBtn.title = on ? 'Put each event\'s peak back on its own date'
            : 'Move each event\'s peak onto the monthly OPEX it overlaps';
        model.events.forEach(ev => {
            ev.values = on ? opexValues(ev, model.days) : ev.baseValues;
        });
        model.totals = totalsOf(model.events);
        hm.classList.remove('play');
        [model.totals].concat(model.events.map(ev => ev.values)).forEach((values, r) => {
            hm.querySelectorAll(`.c[data-r="${r}"]`).forEach((cell, c) => {
                cell.style.setProperty('--v', values[c].toFixed(3));
                cell.style.background = cellColor(values[c]);
                cell.classList.toggle('hot', values[c] >= CONFIG.hotHeat);
            });
        });
    });
}

// Whole screen pixels for the cell grid. At 125% or 150% scaling a 1px CSS gap lands on one screen
// pixel or two depending on where it falls; sizing in screen pixels gives every gap exactly one.
// The matrix is then nudged (under a pixel) so its first cell starts on a screen pixel too:
// from a half-pixel start every gap smears across two half-dark pixels.
function snapGrid() {
    const dpr = window.devicePixelRatio || 1;
    document.querySelectorAll('.env-card').forEach(card => {
        card.style.setProperty('--dpr', dpr);
        card.style.setProperty('--cell-dev', Math.round(CONFIG.cellWidth * dpr));
        card.style.setProperty('--row-dev', Math.round(16 * dpr));
        card.style.setProperty('--row-total-dev', Math.round(20 * dpr));
    });

    const hm = document.getElementById('hm');
    hm.style.margin = '';
    const first = hm.querySelector('.hm-row .cells');
    if (!first) return;
    const box = first.getBoundingClientRect();
    const nudge = v => ((Math.ceil(v * dpr - 0.01) - v * dpr) / dpr).toFixed(4) + 'px';
    hm.style.marginLeft = nudge(box.left + window.scrollX);
    hm.style.marginTop = nudge(box.top + window.scrollY);
    matchIntensityHeight();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
snapGrid();
// Browser zoom changes devicePixelRatio and fires resize; moving to a screen with other scaling
// may not, so also watch for the current ratio to stop matching.
window.addEventListener('resize', snapGrid);
(function watchScale() {
    matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener('change', () => {
        snapGrid();
        watchScale();
    }, { once: true });
})();
buildThemePicker();
applyTheme(savedThemeName());

function loadCsv(url) {
    return fetch(url)
        .then(r => {
            if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`);
            return r.text();
        })
        .then(text => Papa.parse(text, {
            header: true,
            skipEmptyLines: true,
            transformHeader: h => h.trim(),
        }).data);
}

Promise.all([loadCsv('data/events.csv'), loadCsv('data/ibrx.csv'),
    Promise.all(CONFIG.intensityFiles.map(loadCsv))])
    .then(([eventRows, trialRows, intensityFiles]) => {
        const dailyRows = [].concat.apply([], intensityFiles);
        const model = buildMatrix(eventsFromCsv(eventRows).concat(trialsFromCsv(trialRows)));
        render(model);
        renderIntensity(model, dailyRows);
        snapGrid();
        // Drop the load-in wave once it has played: animated cells sit on GPU layers and blur the gaps.
        const hm = document.getElementById('hm');
        setTimeout(() => hm.classList.remove('play'), ((model.events.length + 1) * 2 + DAYS) * 8 + 600);
        wireInteractions(model);
        // Loaded: the loading line is only for "Loading…" and errors.
        document.getElementById('loadingMsg').hidden = true;
    })
    .catch(err => {
        document.getElementById('loadingMsg').textContent = `Error loading data: ${err.message}`;
    });
</script>
